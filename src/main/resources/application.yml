spring:
  application:
    name: tvmaze-api
  data:
    mongodb:
      # La cadena de conexión se toma de la variable de entorno; nunca se versiona.
      uri: ${MONGODB_URI}
      database: tvmaze
      # Crea los índices declarados con @Indexed (p. ej. comments.showId) al iniciar.
      auto-index-creation: true
  jackson:
    deserialization:
      # Rechaza decimales en campos enteros (p. ej. "rating": 4.5) en lugar de truncarlos.
      accept-float-as-int: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # Las respuestas de error se documentan en cada endpoint; sin esto springdoc agregaría
  # a todos los endpoints todas las respuestas de GlobalExceptionHandler (p. ej. 404 en la búsqueda).
  override-with-generic-response: false

tvmaze:
  base-url: https://api.tvmaze.com
